# 全局仿真与流程参数配置
# 采用yaml可读格式，适用于小鼠（rat）医学、生物影像与仿真全流程，所有参数均为权威中文注释

species: rat      # 物种信息，可选rat(小鼠)/human(人)
area: brain       # 主体区域，例如brain（脑部）、full（全身）等
wavelength: 1200   # 主波长，单位nm，建议设置为大于1000nm（如1200）以适配近红外二区（NIR-II）医学成像标准，所有材料参数和导出命名均以此为依据
output_dir: ./output_data  # 所有输出的根目录
random_seed: 23  # 全流程随机种子，保证仿真结果可复现

shape_generation:
  num_shapes: 3     # 随机生成3D形状数量
  shape_types: [cylinder]  # 允许的3D形状类型列表，可选sphere/cube/cylinder
  min_param: 4      # 形状最小尺寸（如半径/体边长）
  max_param: 20     # 形状最大尺寸
  max_rotation: 30  # 每个shape最大旋转角度

lengthunit: 0.1  # 单体素实际长度（单位mm）
perturb_bounds:
  mua: 0.003      # mua扰动范围
  mus: 0.1        # mus扰动范围

forward:
  T0: 0.0e00      # forward起始时间
  T1: 5.0e-09     # forward结束时间
  DT: 5.0e-09     # forward时间步长

src_range:
  z: [60, 120]
  y: [40, 140]
  x: [96, 130]
  max_rotation: 30  # 光源shape最大旋转角

# 自动生成：输出体素bin文件路径
generated_bin_path: ./volume_bases/bin/volume_brain.bin
# 自动生成：输出材料参数yaml文件路径
generated_material_yaml_path: ./volume_bases/material/rat_brain_1200nm.yaml
# 自动生成：输出体素体积对应的三维 shape（三元素分别为深度、高度、宽度，单位体素数，详见生成数据）
volume_shape: [180, 164, 210]

