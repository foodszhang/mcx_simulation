species: rat
area: brain
wavelength: 1200
output_dir: ./output_data
random_seed: 23
shape_generation:
  num_shapes: 3
file_naming:   # ——[新]文件命名模板配置——
  normal:
    config: '{id}.json'      # 标准仿真配置文件名，如“1.json”
    result: '{id}.jnii'      # 标准仿真输出结果文件名，如“1.jnii”
  noscatter:
    config: 'no_{id}.json'   # 无散射仿真配置文件名，如“no_1.json”
    result: 'no_{id}.jnii'   # 无散射仿真输出文件名，如“no_1.jnii”

  shape_types:
  - cylinder
  - ellipsoid
  - sphere
  min_param: 4
  max_param: 20
  max_rotation: 30
lengthunit: 0.1
