  DT: 5.0e-09
src_range:
  z:
  - 60
  - 120
  y:
  - 40
  - 140
  x:
  - 96
  - 130
  max_rotation: 30
projection:
  angles:
  - -90
  - -60
  - -30
  - 0
  - 30
  - 60
  - 90
  detectors:
  - 1
  filename_pattern: proj_{angle}deg_det{det}.npz
