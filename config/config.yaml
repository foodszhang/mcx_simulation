# 全局仿真与流程参数配置
# 采用yaml可读格式，适用于医学/生物影像与仿真主流程，全部字段配中文权威说明

species: rat      # 物种信息，可选rat(小鼠)/human(人)
area: brain       # 主体区域（如brain（脑部）、full（全身）等）
wavelength: 1200   # 主波长（nm），如1200适配NIR-II成像
output_dir: ./output_data  # 所有输出的根目录
random_seed: 23  # 全流程随机种子，保证仿真结果可复现

shape_generation:
  num_shapes: 3     # 随机生成3D形状数量
  shape_types: [cylinder, ellipsoid, sphere]  # 可选sphere/cube/cylinder/ellipsoid
  min_param: 4      # 形状最小尺寸（如半径/体边长）
  max_param: 20     # 形状最大尺寸
  max_rotation: 30  # 每个shape最大旋转角度

lengthunit: 0.1  # 单体素实际长度（单位mm）
perturb_bounds:
  mua: 0.003      # mua扰动范围
  mus: 0.1        # mus扰动范围

forward:
  T0: 0.0e00
  T1: 5.0e-09
  DT: 5.0e-09

src_range:
  z: [60, 120]
  y: [40, 140]
  x: [96, 130]
  max_rotation: 30

# 投影与探测器参数:
projection:
  # 投影角度列表，每个元素为角度（单位度）
  angles: [0, 15, 30, 45, 60, 90]
  # 探测器阵列参数（根据具体仿真物理模型自定义，示例为每个投影都用这些编号）
  detectors: [1, 2, 3, 4]
  # 输出npz文件命名规则，可用{angle}、{det}占位
  filename_pattern: "proj_{angle}deg_det{det}.npz"

# 自动生成脚本用：输出体素bin路径等
# generated_bin_path: ...
# generated_material_yaml_path: ...
# volume_shape: ...

